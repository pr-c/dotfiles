debug {
  disable_logs = false
  log_damage = true
}

################
### MONITORS ###
################

monitor=,preferred,auto,1
source=~/.config/hypr/monitors.conf 

###################
### MY PROGRAMS ###
###################


$terminal = kitty
$fileManager = dolphin
$menu = wofi --show drun


#################
### AUTOSTART ###
#################


exec-once = waybar
exec-once = hyprpaper 
exec-once = nm-applet 


#############################
### ENVIRONMENT VARIABLES ###
#############################


env = HYPRCURSOR_THEME,rose-pine-hyprcursor
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

env = GDK_SCALE,1

env = GDK_BACKEND,wayland,x11,*
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

env = MOZ_ENABLE_WAYLAND,1

ecosystem {
    no_donation_nag = true
#   enforce_permissions = 1
}

###################
### PERMISSIONS ###
###################

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 5
    gaps_out = 10

    border_size = 1

    col.active_border = rgba(7d0b2dff) rgba(ffc014ff) 270deg
    col.inactive_border = rgba(595959aa) 270deg

    resize_on_border = true
    allow_tearing = false
    layout = scrolling
}

decoration {
    rounding = 5
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 1

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = yes

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]


misc {
    force_default_wallpaper = 0 
    disable_hyprland_logo = true 
    enable_anr_dialog = false
}


#############
### INPUT ###
#############

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

cursor {
    no_hardware_cursors = true
}


###################
### KEYBINDINGS ###
###################

$mainMod = SUPER # Sets "Windows" key as main modifier


bind = $mainMod, Return, exec, $terminal
bind = $mainMod, W, exec, firefox

bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, Space, togglefloating,
bind = $mainMod, D, exec, $menu
bind = $mainMod, F, fullscreen, 1
bind = $mainMod, tab, changegroupactive

bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10



bind = $mainMod, g, togglegroup
bind = $mainMod SHIFT, g, lockactivegroup, toggle

bind = $mainMod SHIFT, t, movetoworkspacesilent, special:cds
bind = $mainMod, t, togglespecialworkspace, cds

bind = $mainMod SHIFT, backslash, movetoworkspacesilent, special:console
bind = $mainMod, backslash, togglespecialworkspace, console

bind = $mainMod, x, togglespecialworkspace, p
bind = $mainMod SHIFT, x, movetoworkspacesilent, special:p

bind = $mainMod, F12, togglespecialworkspace, deep_dark
bind = $mainMod SHIFT, F12, movetoworkspacesilent, special:deep_dark


bind = $mainMod, O, workspace, 11
bind = $mainMod SHIFT, O, movetoworkspacesilent, 11

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273,  resizewindow
 
# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set lockactivegroupmute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous


bind = $mainMod SHIFT, j, movewindow, d
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, h, movewindow, l
bind = CTRL $mainMod SHIFT, j, movewindoworgroup, d
bind = CTRL $mainMod SHIFT, k, movewindoworgroup, u
bind = CTRL $mainMod SHIFT, l, movewindoworgroup, r
bind = CTRL $mainMod SHIFT, h, movewindoworgroup, l

bind = $mainMod CTRL SHIFT, page_down, exec, hyprctl keyword monitor "eDP-1, disable"
bind = $mainMod CTRL SHIFT, page_up, exec, hyprctl keyword monitor "eDP-1, enable"

bind = $mainMod, period, movecurrentworkspacetomonitor, r
bind = $mainMod, comma, movecurrentworkspacetomonitor, l

bind = $mainMod CTRL SHIFT, o, exec, hyprlock


###############################
#### LAYOUT SPECIFIC STUFF ####
###############################

dwindle {
    preserve_split = true # You probably want this
    bind = $mainMod, p, pseudo, # dwindle
    bind = $mainMod, v, layoutmsg, togglesplit # dwindle
}

master {
    new_status = master
    bind= $mainMod,z, layoutmsg, swapwithmaster
}

scrolling {
    bind= $mainMod,z, layoutmsg, fit visible
    bind= $mainMod,y, layoutmsg, promote
    bind= $mainMod, EQUAL, layoutmsg, colresize +0.25
    bind= $mainMod, MINUS, layoutmsg, colresize -0.25
}
##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule = match:initial_title ^(Figures)$, tag +output
windowrule = match:tag output, tile on
windowrule = match:tag output, workspace 11 silent

windowrule = center off, match:class UnrealEditor
windowrule = float on, match:class UnrealEditor
windowrule = no_follow_mouse true, match:class UnrealEditor
windowrule = no_initial_focus on, match:class UnrealEditor

workspace=2, layout:master
bind = $mainMod, A, exec, ~/.config/hypr/scripts/active_layout_dwindle.sh
bind = $mainMod, B, exec, ~/.config/hypr/scripts/active_layout_scrolling.sh
bind = $mainMod, C, exec, ~/.config/hypr/scripts/active_layout_master.sh
